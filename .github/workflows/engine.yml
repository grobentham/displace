name: Engine

# Runs the news engine, saves any new data, and publishes the site to GitHub Pages.
# Times are UTC and chosen so each New York release window is covered in both winter and summer time.
on:
  schedule:
    - cron: "47 11 * * 1-5"  # daily brief (06:45/07:45 New York)
    - cron: "47 12 * * 1-5"  # daily brief refresh
    - cron: "52 13 * * 1-5"  # after 08:30 releases
    - cron: "22 14 * * 1-5"  # after 08:30 / 10:00 releases
    - cron: "22 15 * * 1-5"  # after 10:00 releases
    - cron: "32 19 * * 1-5"  # after 14:00 (Fed) releases
    - cron: "22 22 * * 1-5"  # late data and archived readings
    - cron: "22 22 * * 0"    # Sunday: weekly outlook
    - cron: "42 22 * * *"    # prepare the 07:00 SGT brief starting at 06:40 SGT; the bias forecast (17:42 New York in winter)
    - cron: "42 21 * * *"    # the bias forecast in summer (17:42 New York daylight time): must be in before the 18:00 open
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["site/**", "engine/**", "tests/**", "research/**", ".github/workflows/engine.yml"]
  push:
    branches: [main]
    paths: ["site/**", "engine/**", "tests/**", "research/**", ".github/workflows/engine.yml"]

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install numpy (the quant models)
        run: python -m pip install --quiet "numpy>=2,<3"
      - name: Test engine
        run: |
          python engine/test_engine.py
          python engine/test_earnings.py
          python engine/test_public_news.py
          python engine/test_morning.py
          python engine/test_predict.py
          python engine/test_sources.py
          python engine/test_moves.py
          python engine/test_surprise.py
          python engine/test_bias.py
          python engine/test_gate.py
          python engine/test_discovery_v3.py
          python engine/test_discovery.py
          python engine/test_intelligence.py
          python engine/test_signals.py
          python engine/test_relationships.py
          python engine/test_evidence.py
          python engine/test_publisher.py
          python engine/test_atlas.py
          python engine/test_validation.py
          python engine/test_model_safeguards.py
          python engine/test_modelaudit.py
          node --check site/assets/terminal.js
          node tests/test_terminal.js
          node --check site/assets/validation.js
          node --check site/assets/modelaudit.js
          node --check site/assets/search.js
          node tests/test_search.js
          python engine/test_sitebuild.py
          python tests/test_site_routes.py

  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate archived report pages for browser smoke tests
        run: python engine/sitebuild.py
      - name: Install pinned browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Desktop and mobile browser checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/displace-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/terminal.html >/dev/null && break; sleep 1; done
          node tests/browser_smoke.js

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, browser-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numpy (the quant models)
        run: python -m pip install --quiet "numpy>=2,<3"

      - name: Refresh calendar and news
        # each step through engine/guard.py: a failing engine is recorded and the others still run
        run: |
          python engine/guard.py calendar engine/engine.py
          python engine/guard.py news engine/news.py
          python engine/guard.py morning engine/morning.py

      - name: News-outcome engine (gold, NQ and rates by release)
        run: |
          python engine/guard.py predict engine/predict.py
          python engine/guard.py watch engine/watch.py
          python engine/guard.py bias engine/bias.py
          python engine/guard.py discovery_v3 engine/discovery_v3.py   # v1/v2 retired 24 Nov 2026: biased estimator (files kept)
          python engine/guard.py macro engine/macro.py
          python engine/guard.py signals engine/signals.py
          python engine/guard.py relationships engine/relationships.py
          python engine/guard.py evidence engine/evidence.py
          python engine/guard.py publishing engine/publisher.py
          python engine/guard.py atlas engine/atlas.py
          python engine/guard.py validation engine/validation.py
          python engine/guard.py modelaudit engine/modelaudit.py

      - name: Final check before publishing (block invalid candidate snapshot)
        run: python engine/gate.py --strict

      - name: Build static research articles and sitemap
        run: python engine/sitebuild.py

      - name: Save new data
        run: |
          git config user.name "displace-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data site/reports site/sitemap.xml site/calendar.ics site/calendar-high.ics engine/pending.json engine/cache
          if ! git diff --cached --quiet; then
            git commit -m "Engine update $(date -u +%Y-%m-%dT%H:%MZ)"
            # another run or a code push may have landed meanwhile: rebase onto it and retry
            git push || { echo "Candidate commit could not be saved; refusing to deploy"; exit 1; }
          fi

      - name: Flag when the schedule needs more dates
        if: hashFiles('engine/STALE') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create schedule --color FBCA04 --description "Release schedule needs dates" 2>/dev/null || true
          if [ "$(gh issue list --label schedule --state open --json number --jq length)" = "0" ]; then
            gh issue create --title "Add more release dates" --label schedule --body "$(cat engine/STALE)"
          fi

      - name: Flag failed quality checks
        if: hashFiles('engine/QUALITY_FAIL') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create quality --color D93F0B --description "Engine quality checks failed" 2>/dev/null || true
          if [ "$(gh issue list --label quality --state open --json number --jq length)" = "0" ]; then
            gh issue create --title "Engine quality check failed" --label quality --body "$(cat engine/QUALITY_FAIL)

          Full report: site/data/engine/quality.json"
          fi

      - name: Flag releases with missing figures
        if: hashFiles('engine/MISSING') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data --color 5319E7 --description "Release figures missing" 2>/dev/null || true
          if [ "$(gh issue list --label data --state open --json number --jq length)" = "0" ]; then
            gh issue create --title "Release figures missing" --label data --body "$(cat engine/MISSING)"
          fi

      - name: Make sure the backup scheduler is waiting
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --workflow scheduler.yml --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length')
          if [ "$active" = "0" ]; then gh workflow run scheduler.yml --ref main && echo "scheduler started"; else echo "scheduler already waiting"; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub's Pages API sometimes can't find a just-uploaded artifact ("Fetching artifact metadata failed"),
      # which failed about half the runs in late Nov 2026: wait and try twice more
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Record conservative publication receipt after successful deployment
        if: ${{ success() && (steps.deploy.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success') }}
        run: |
          python engine/publication.py
          git add site/data/bias/publication-receipts.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified Pages publication receipt"
            git push || { echo "Receipt not persisted; no prospective credit will be given"; exit 1; }
          fi

      - name: Engine health (red if any step failed; the site keeps the last good files)
        if: ${{ !cancelled() }}
        run: python engine/gate.py --report
