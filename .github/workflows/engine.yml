name: Engine

# Runs the news engine, saves any new data, and publishes the site to GitHub Pages.
# Times are UTC and chosen so each New York release window is covered in both winter and summer time.
on:
  schedule:
    - cron: "45 11 * * 1-5"  # daily brief (06:45/07:45 New York)
    - cron: "45 12 * * 1-5"  # daily brief refresh
    - cron: "50 13 * * 1-5"  # after 08:30 releases
    - cron: "20 14 * * 1-5"  # after 08:30 / 10:00 releases
    - cron: "20 15 * * 1-5"  # after 10:00 releases
    - cron: "30 19 * * 1-5"  # after 14:00 (Fed) releases
    - cron: "20 22 * * 1-5"  # late data and archived readings
    - cron: "20 22 * * 0"    # Sunday: weekly outlook
    - cron: "40 22 * * *"    # prepare the 07:00 SGT brief starting at 06:40 SGT
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["site/**", "engine/**", ".github/workflows/engine.yml"]
  push:
    branches: [main]
    paths: ["site/**", "engine/**", ".github/workflows/engine.yml"]

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test engine
        run: |
          python engine/test_engine.py
          python engine/test_earnings.py
          python engine/test_public_news.py
          python engine/test_morning.py
          python engine/test_predict.py
          python engine/test_sources.py
          python engine/test_moves.py
          python engine/test_direction.py

  publish:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh calendar and news
        run: |
          python -u engine/engine.py
          python -u engine/news.py
          python -u engine/morning.py

      - name: News-outcome engine (gold, NQ and rates by release)
        run: |
          python -u engine/predict.py
          python -u engine/watch.py

      - name: Save new data
        run: |
          git config user.name "displace-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data site/calendar.ics site/calendar-high.ics engine/pending.json engine/cache
          if ! git diff --cached --quiet; then
            git commit -m "Engine update $(date -u +%Y-%m-%dT%H:%MZ)"
            # another run or a code push may have landed meanwhile: rebase onto it and retry
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main
              sleep $((i * 5))
            done
          fi

      - name: Flag when the schedule needs more dates
        if: hashFiles('engine/STALE') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create schedule --color FBCA04 --description "Release schedule needs dates" 2>/dev/null || true
          if [ "$(gh issue list --label schedule --state open --json number --jq length)" = "0" ]; then
            gh issue create --title "Add more release dates" --label schedule --body "$(cat engine/STALE)"
          fi

      - name: Flag failed quality checks
        if: hashFiles('engine/QUALITY_FAIL') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create quality --color D93F0B --description "Engine quality checks failed" 2>/dev/null || true
          if [ "$(gh issue list --label quality --state open --json number --jq length)" = "0" ]; then
            gh issue create --title "Engine quality check failed" --label quality --body "$(cat engine/QUALITY_FAIL)

          Full report: site/data/engine/quality.json"
          fi

      - name: Flag releases with missing figures
        if: hashFiles('engine/MISSING') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data --color 5319E7 --description "Release figures missing" 2>/dev/null || true
          if [ "$(gh issue list --label data --state open --json number --jq length)" = "0" ]; then
            gh issue create --title "Release figures missing" --label data --body "$(cat engine/MISSING)"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
