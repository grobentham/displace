name: Probe daily bars (temporary)
on: pull_request
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd engine && python3 - <<'PY'
          import bias, datetime as dt
          for m in ("nq", "gold"):
              d = bias.download(bias.MARKETS[m][0])
              ks = sorted(d); print(m, len(ks), ks[0], ks[-3:], [d[k] for k in ks[-3:]])
              gaps = [(a, b) for a, b in zip(ks, ks[1:]) if (dt.date.fromisoformat(b) - dt.date.fromisoformat(a)).days > 5]
              print("gaps >5d", len(gaps), gaps[:5])
              rows = bias.finished(d, dt.datetime.now(bias.NY))
              st = bias.study(rows)
              print("base", st["base"], "days", st["days"])
              for k, v in st["cases"].items(): print("  ", k, v)
          PY
