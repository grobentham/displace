name: Probe quant v2 (temporary)
on: pull_request
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet "numpy>=2,<3"
      - run: |
          cd engine && python -W ignore - <<'PY'
          import bias as B, json, datetime as dt
          B.run()
          d = json.load(open(B.OUT))
          print("inputs", d["inputs"])
          for m, v in d["markets"].items():
              print("==", m, v["history"], "P(up)", v["p_up"], v["bias"], "t_req", v["t_req"])
              print("   vol", v["vol"]["stats"], v["vol"]["inputs"], v["vol"]["multipliers"])
              print("   range", v["range"], "touch1", v["touch"][1] if len(v["touch"]) > 1 else None)
              print("   takes", v["takes"])
              print("   signals", [(s["key"], s["skill"], s["t"], s["tested"]) for s in v["signals"]])
              print("   events", [(e["key"], e["up"], e["base"], e["z"], e["tested"]) for e in v["calendar"]])
          PY
