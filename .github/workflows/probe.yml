name: Probe live loader (temporary)
on:
  pull_request:
    paths: [".github/probe/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 .github/probe/live.py
