name: World

# Displace World: collect from free public sources (GDELT, SEC EDGAR, Federal Register, USGS, data.gov.sg), publish new
# signals, grade claims, save the ledger, then start the Engine workflow, which deploys the site.
# No API keys. Shares the Engine's concurrency group so the two never write the ledger at the same time.
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours; the 00:17 UTC run (08:17 Singapore) writes the day's Early edition
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: engine-refs/heads/main
  cancel-in-progress: false

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: python engine/test_world.py
      - name: Collect, publish and grade
        run: python engine/guard.py world_run engine/world.py run
      - name: Save the ledger
        run: |
          git config user.name "displace-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/world site/world engine/cache/world site/data/engine/health.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "World update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Deploy through the Engine workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run engine.yml --ref main
      - name: Fail if a step failed
        if: ${{ !cancelled() }}
        run: python engine/gate.py --report
